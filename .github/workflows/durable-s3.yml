name: durable-s3-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/durable-s3.yml
      - deps.edn
      - docs/durable-s3.md
      - src/jdbc/chdb/durable.clj
      - src/jdbc/chdb/durable/backend.clj
      - src/jdbc/chdb/durable/control.clj
      - src/jdbc/chdb/durable/digest.cljc
      - src/jdbc/chdb/durable/s3.clj
      - src/jdbc/chdb/durable/s3_curl.clj
      - test/durable-s3-curl.sh
      - test/durable-large-checkpoint.sh
      - test/durable-s3-minio.sh
      - test/jdbc/chdb_durable_s3_curl_test.clj
      - test/jdbc/chdb_durable_large_checkpoint_qualification.clj
      - test/jdbc/chdb_durable_s3_minio_test.clj
      - test/jdbc/chdb_durable_s3_provider_test.clj
      - test/jdbc/chdb_durable_s3_test.clj
      - test/support/s3_http_fixture.py
      - test/support/s3_streaming_fixture.py

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.3
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.3
      MINIO_IMAGE: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    steps:
      - uses: actions/checkout@v4
      - name: Install Jolt v0.8.3
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.3/install \
            | bash -s -- --dir "$install_dir" --version 0.8.3
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        run: test "$(jolt --version)" = "jolt v0.8.3"
      - name: Test semantic S3 contract
        run: jolt -M:durable-s3-test
      - name: Test libcurl SigV4 loopback transport
        run: bash test/durable-s3-curl.sh jolt
      - name: Qualify bounded-memory large checkpoints
        run: bash test/durable-large-checkpoint.sh jolt
      - name: Qualify against pinned MinIO
        run: bash test/durable-s3-minio.sh jolt
