name: Durable Python writer fixture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/install-jolt-aspects/**'
      - '.github/workflows/durable-python-fixture.yml'
      - 'deps.edn'
      - 'scripts/generate-durable-python-writer-fixture.py'
      - 'scripts/verify-durable-python-writer-fixture.sh'
      - 'src/jdbc/chdb/durable/**'
      - 'test/jdbc/chdb_durable_python_writer_fixture_test.clj'

permissions:
  contents: read

jobs:
  python-writer-to-jolt-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Jolt aspect compiler
        uses: ./.github/actions/install-jolt-aspects

      - name: Acquire checksum-pinned Python source, wheel, and native library
        env:
          SOURCE_SHA: 66643e5030fb73c30ac5cdd31d4c7858ea040ed0
          SOURCE_TREE: a61323f3f7246c83f9083ca8d4f733a7c4402c50
          SOURCE_ARCHIVE_SHA256: 4269548e589fa34497c207e84e660785399b52edecb7294cc929be796b04b381
          CORE_WHEEL_SHA256: b10b96f9599fab42ba51d9be80333e1819782bdc8a91b2b26979149693ba431f
          NATIVE_ARCHIVE_SHA256: bc33260c32acf78eade2ac41a9115f38e00404651fa42e3bb4c419e4f011c031
          NATIVE_LIBRARY_SHA256: 36ad4e999882821ef13cf2d0f52c93f48e6ee1b4498b35a201c23ce4b8d15bf5
          NATIVE_HEADER_SHA256: ec234db7e47589b3780bcd9a5508f5666cb44b0b56cc6f3079c8a24aa1b8d911
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/durable-python-fixture"
          mkdir -p "$root/source-repo" "$root/source-extract" "$root/wheel" "$root/site" "$root/native"

          git -C "$root/source-repo" init
          git -C "$root/source-repo" remote add origin https://github.com/chdb-io/chdb.git
          git -C "$root/source-repo" fetch --depth 1 origin "$SOURCE_SHA"
          test "$(git -C "$root/source-repo" rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$root/source-repo" rev-parse FETCH_HEAD^{tree})" = "$SOURCE_TREE"
          git -C "$root/source-repo" archive --format=tar --prefix=chdb-66643e5/ \
            -o "$root/chdb-source.tar" FETCH_HEAD
          test "$(sha256sum "$root/chdb-source.tar" | awk '{print $1}')" = "$SOURCE_ARCHIVE_SHA256"
          tar -xf "$root/chdb-source.tar" -C "$root/source-extract"

          python3 -m pip download --no-deps --only-binary=:all: \
            --dest "$root/wheel" chdb-core==26.7.3
          wheel=$(find "$root/wheel" -maxdepth 1 -type f -name 'chdb_core-26.7.3-*.whl')
          test "$(sha256sum "$wheel" | awk '{print $1}')" = "$CORE_WHEEL_SHA256"
          python3 -m pip install --no-deps --target "$root/site" "$wheel"

          curl -fsSL --retry 2 --retry-all-errors \
            -o "$root/native.tar.gz" \
            https://github.com/chdb-io/chdb-core/releases/download/v26.7.3/linux-x86_64-libchdb.tar.gz
          test "$(sha256sum "$root/native.tar.gz" | awk '{print $1}')" = "$NATIVE_ARCHIVE_SHA256"
          tar -xzf "$root/native.tar.gz" -C "$root/native"
          test "$(sha256sum "$root/native/libchdb.so" | awk '{print $1}')" = "$NATIVE_LIBRARY_SHA256"
          test "$(sha256sum "$root/native/chdb.h" | awk '{print $1}')" = "$NATIVE_HEADER_SHA256"

          echo "QUALIFICATION_ROOT=$root" >> "$GITHUB_ENV"
          echo "CORE_WHEEL=$wheel" >> "$GITHUB_ENV"

      - name: Run exact Python-writer logical fixture exchange
        env:
          JOLT_CACHE_DIR: ${{ runner.temp }}/jolt-cache
          JOLT_GITLIBS_DIR: ${{ runner.temp }}/jolt-gitlibs
          JOLT_GATEBOOT_BUILD_DIR: ${{ runner.temp }}/jolt-gateboot
        run: |
          set -euo pipefail
          wrapper="$RUNNER_TEMP/jolt-with-chez-10.4.1"
          printf '%s\n' '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'test "$(/opt/chez/bin/scheme --version)" = 10.4.1' \
            'export CHEZ=/opt/chez/bin/scheme CHEZSCHEME=/opt/chez/bin/scheme' \
            'export JOLT_CHEZ=/opt/chez/bin/scheme JOLT_CHEZ_CSV=/opt/chez/bin/scheme' \
            'exec "$@"' > "$wrapper"
          chmod +x "$wrapper"
          JOLT_WRAPPER="$wrapper" scripts/verify-durable-python-writer-fixture.sh \
            "$RUNNER_TEMP/python-writer-output" \
            "$QUALIFICATION_ROOT/source-extract/chdb-66643e5" \
            "$QUALIFICATION_ROOT/chdb-source.tar" \
            "$CORE_WHEEL" \
            "$QUALIFICATION_ROOT/site" \
            "$(command -v jolt)" \
            "$QUALIFICATION_ROOT/native/libchdb.so" \
            "$QUALIFICATION_ROOT/native/chdb.h"
