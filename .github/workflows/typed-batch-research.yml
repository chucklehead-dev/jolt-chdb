name: typed S3 batch amortization research

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only cloud preflight, or bounded short batch sweep
        type: choice
        options: [preflight, sweep]
        default: preflight

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: measured-exporter-storage
  cancel-in-progress: false

jobs:
  current-storage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-durable-ci
    env:
      JOLT_AOT_CACHE: '0'
      JOLT_NO_USER_DEPS: '1'
      QUALIFIED_RUNTIME_PROFILE: current-0821-1ae7
      QUALIFIED_RUNTIME_RUN_ID: '38618434034'
      QUALIFIED_RUNTIME_RUN_ATTEMPT: '1'
      QUALIFIED_RUNTIME_WORKFLOW_SHA: 1533b9fe6f7782f4d024a07aefbfb7ce50c4251b
      QUALIFIED_RUNTIME_ARTIFACT_ID: '11921513712'
      QUALIFIED_RUNTIME_ARTIFACT_SHA256: 931dda8bf4e9d9beeaa92ad64b8a1c925d3ab670f87414ec9efee9af28cb3537
      QUALIFIED_RUNTIME_BINARY_SHA256: 06a2ccb858c072bfcd74ce94d96eb95f008d75e0fb1f46117728602572189811
      SDK_STREAM_ARM: stream
      SDK_EXPORT_CALLERS: '1'
      CHDB_BENCH_OWNED_OUTPUT: 'true'
      CHDB_BENCH_SAMPLE_COUNTERS: 'true'
      CHDB_BENCH_METADATA_READER: native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require closed mode and workload bounds
        env:
          TASK_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$TASK_MODE" in preflight|sweep) ;; *) exit 1 ;; esac
          # Closed32sample derivative, not the immutable qualification gate.
          # Six fixed S3 arms share a total6GiB/24k-request budget.
          mkdir -p target/typed-batch-research/preflight
      - uses: actions/checkout@v4
        if: inputs.mode == 'sweep'
        with:
          ref: 3fd96c4691c5db49ed4d3ef55622aaa6b9074127
          path: .qualification/benchmark
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.mode == 'sweep'
        with:
          repository: chucklehead-dev/jolt-otel-clickhouse
          ref: 67e28b59bfd215da982682dd9c59d51d52d460ed
          path: .qualification/exporter
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.mode == 'sweep'
        with:
          repository: casselc/data.json
          ref: 8d557cc18eb9526ed29ae5613089c3793d5973fa
          path: .qualification/json
          persist-credentials: false
      - name: Authenticate exact green compiler artifact
        if: inputs.mode == 'sweep'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/fetch-qualified-durable-runtime.sh"
          curl -fsSL --connect-timeout 15 --max-time 30 \
            https://raw.githubusercontent.com/chucklehead-dev/jolt-otel-clickhouse/96119103195b67cfc9fd52277251888980fc7852/scripts/fetch-qualified-durable-runtime.sh \
            -o "$helper"
          printf '%s  %s\n' 81030fafdb2e3c79765792d043585139f4410c27a281113dd19874b4c27e74b2 "$helper" | sha256sum -c -
          TMPDIR=/tmp timeout --signal=TERM --kill-after=5s 240s bash "$helper" | tee "$RUNNER_TEMP/qualified-runtime.log"
          test "$(grep -c '^QUALIFIED_RUNTIME_BIN=' "$RUNNER_TEMP/qualified-runtime.log")" = 1
          task_bin=$(sed -n 's/^QUALIFIED_RUNTIME_BIN=//p' "$RUNNER_TEMP/qualified-runtime.log")
          [[ "$task_bin" =~ ^/tmp/qualified-durable-runtime\.[A-Za-z0-9]+/jolt$ ]]
          test -f "$task_bin" && test ! -L "$task_bin"
          test "$(realpath "$task_bin")" = "$task_bin"
          echo "BENCH_JOLT_BIN=$task_bin" >> "$GITHUB_ENV"
          echo "BENCH_RUNTIME_BINARY_SHA256=$QUALIFIED_RUNTIME_BINARY_SHA256" >> "$GITHUB_ENV"
          echo "BENCH_EXPECT_EXPORTER_ROOT=$GITHUB_WORKSPACE/.qualification/exporter" >> "$GITHUB_ENV"
          echo "BENCH_EXPECT_JSON_ROOT=$GITHUB_WORKSPACE/.qualification/json" >> "$GITHUB_ENV"
          echo "BENCH_EXPECT_BENCHMARK_ROOT=$GITHUB_WORKSPACE/.qualification/benchmark" >> "$GITHUB_ENV"
          echo "TASK_ORIGINAL_TYPED_DRIVER=$GITHUB_WORKSPACE/scripts/typed_storage_batch_driver.clj" >> "$GITHUB_ENV"
          echo "TASK_TYPED_BUDGET_DRIVER=$GITHUB_WORKSPACE/scripts/typed_storage_batch_budget_driver.clj" >> "$GITHUB_ENV"
          task_wrapper="$GITHUB_WORKSPACE/scripts/current_typed_jolt.sh"
          echo "BENCH_JOLT_WRAPPER=$task_wrapper" >> "$GITHUB_ENV"
      - name: Test real budget entry without cloud access
        if: inputs.mode == 'sweep'
        run: |
          set -euo pipefail
          bash scripts/test_typed_batch_failure_receipts.sh
          task_root=$(mktemp -d /tmp/typed-batch-driver.XXXXXXXX)
          trap '[[ "$task_root" =~ ^/tmp/typed-batch-driver\.[A-Za-z0-9]+$ ]] && rm -rf -- "$task_root"' EXIT
          export TASK_BATCH_BUDGET_FILE="$task_root/ledger.edn"
          "$BENCH_JOLT_WRAPPER" "$BENCH_JOLT_BIN" -Srepro scripts/test_typed_batch_driver.clj "$task_root"
      - name: Install exact native26.9.0 asset without changing application defaults
        if: inputs.mode == 'sweep'
        run: |
          set -euo pipefail
          task_native_dir=$(mktemp -d "$RUNNER_TEMP/current-typed-native.XXXXXXXX")
          task_archive="$task_native_dir/native.tar.gz"
          curl -fsSL --connect-timeout 15 --max-time 300 \
            https://github.com/chdb-io/chdb-core/releases/download/v26.9.0/linux-x86_64-libchdb.tar.gz -o "$task_archive"
          printf '%s  %s\n' c6398bcc71dc58d12fb81548540aacd5d8248830ec81cec537f51c114670543b "$task_archive" | sha256sum -c -
          task_member=$(tar -tzf "$task_archive" | grep -E '(^|/)libchdb\.so$')
          test "$(printf '%s\n' "$task_member" | wc -l)" = 1
          tar --extract --gzip --to-stdout --file "$task_archive" -- "$task_member" > "$task_native_dir/libchdb.so"
          printf '%s  %s\n' a7d22ade86e1de82b187adf572b569a6034600ce932c52b0acb8c97b82430557 "$task_native_dir/libchdb.so" | sha256sum -c -
          rm -- "$task_archive"
          echo "JOLT_CHDB_LIB=$task_native_dir/libchdb.so" >> "$GITHUB_ENV"
      - name: Check actual frozen S3 prefix parser without cloud access
        if: inputs.mode == 'sweep'
        run: |
          set -euo pipefail
          "$BENCH_JOLT_WRAPPER" "$BENCH_JOLT_BIN" -Srepro \
            -Sdeps '{:paths ["src" "resources" ".qualification/benchmark/bench"]}' \
            scripts/test_typed_batch_prefix.clj "$BENCH_EXPECT_BENCHMARK_ROOT"
      - name: Check short matched local baseline first
        if: inputs.mode == 'sweep'
        timeout-minutes: 10
        env:
          SDK_STORAGE_ARM: local
        run: |
          set -euo pipefail
          task_root=$(mktemp -d /tmp/typed-batch-local.XXXXXXXX)
          trap '[[ "$task_root" =~ ^/tmp/typed-batch-local\.[A-Za-z0-9]+$ ]] && rm -rf -- "$task_root"' EXIT
          mkdir -p target/typed-batch-research/local
          driver="$GITHUB_WORKSPACE/scripts/run_typed_batch_research.sh"
          timeout --kill-after=5s 300s bash "$driver" window "$task_root" 10000 32 true wide16 > "$task_root/writer.log" 2>&1
          CHDB_BENCH_METADATA_READER=stock timeout --kill-after=5s 120s bash "$driver" reader "$task_root" 10000 32 true wide16 > "$task_root/reader.log" 2>&1
          cp "$task_root/writer.edn" target/typed-batch-research/local/local-writer.edn
          cp "$task_root/reader.edn" target/typed-batch-research/local/local-reader.edn
      - name: Assume existing protected CI role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DURABLE_ROLE_ARN }}
          role-session-name: chdb-typed-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_DURABLE_REGION }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Verify deployed scope and bounded lifecycle before object writes
        timeout-minutes: 5
        env:
          TASK_ROLE_ARN: ${{ vars.AWS_DURABLE_ROLE_ARN }}
          TASK_BUCKET: ${{ vars.AWS_DURABLE_BUCKET }}
          TASK_PREFIX: ci/jolt-chdb/${{ github.run_id }}-${{ github.run_attempt }}/typed-window
          AWS_PAGER: ''
        run: |
          set -euo pipefail
          # No raw policy, bucket/role identifiers, headers, credentials or
          # CLI stderr are printed or uploaded. Unsupported policy shapes fail.
          python3 scripts/typed_s3_preflight.py | tee target/typed-batch-research/preflight/preflight.json
      - name: Run fixed S3 forward and reverse sweep with full recovery
        if: inputs.mode == 'sweep'
        timeout-minutes: 45
        env:
          SDK_STORAGE_ARM: s3
          JOLT_CHDB_S3_BUCKET: ${{ vars.AWS_DURABLE_BUCKET }}
          TASK_BASE_PREFIX: ci/jolt-chdb/${{ github.run_id }}-${{ github.run_attempt }}/typed-window
        run: |
          set -euo pipefail
          # No tracing/env/header/backend dump. Aliases are exact AWS_* copies.
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$AWS_SESSION_TOKEN"
          export JOLT_CHDB_S3_ENDPOINT="https://s3.${AWS_REGION}.amazonaws.com"
          export JOLT_CHDB_S3_REGION="$AWS_REGION"
          export JOLT_CHDB_S3_ACCESS_KEY="$AWS_ACCESS_KEY_ID"
          export JOLT_CHDB_S3_SECRET_KEY="$AWS_SECRET_ACCESS_KEY"
          export JOLT_CHDB_S3_SESSION_TOKEN="$AWS_SESSION_TOKEN"
          export TASK_BATCH_BUDGET_FILE="$RUNNER_TEMP/typed-batch-budget.edn"
          printf '%s\n' '{:requests 0 :completed 0 :upload-bytes 0}' > "$TASK_BATCH_BUDGET_FILE"
          for task_pair in 1:10000 2:20000 3:50000 4:50000 5:20000 6:10000; do
            (
              task_index=${task_pair%:*}
              task_size=${task_pair#*:}
              export JOLT_CHDB_S3_PREFIX="$TASK_BASE_PREFIX/$task_index"
              task_root=$(mktemp -d /tmp/typed-batch-s3.XXXXXXXX)
              trap '[[ "$task_root" =~ ^/tmp/typed-batch-s3\.[A-Za-z0-9]+$ ]] && rm -rf -- "$task_root"' EXIT
              task_report="$GITHUB_WORKSPACE/target/typed-batch-research/s3-$task_index"
              mkdir -p "$task_report"
              driver="$GITHUB_WORKSPACE/scripts/run_typed_batch_research.sh"
              run_phase() {
                local task_phase="$1" task_limit="$2" task_status
                if timeout --kill-after=5s "${task_limit}s" bash "$driver" "$task_phase" "$task_root" "$task_size" 32 true wide16 > "$task_root/$task_phase.log" 2>&1; then
                  return 0
                else
                  task_status=$?
                  printf '{:scope :typed-batch-process-failure :phase :%s :exit-code %d}\n' \
                    "$task_phase" "$task_status" > "$task_report/process-failure.edn" || true
                  if [[ -f "$task_root/driver-failure.edn" && ! -L "$task_root/driver-failure.edn" ]]; then
                    cp "$task_root/driver-failure.edn" "$task_report/driver-failure.edn" || true
                  fi
                  return "$task_status"
                fi
              }
              run_phase window 300
              cp "$task_root/writer.edn" "$task_report/s3-writer.edn"
              cp "$task_root/http-budget.edn" "$task_report/s3-writer-budget.edn"
              CHDB_BENCH_METADATA_READER=stock run_phase reader 120
              cp "$task_root/reader.edn" "$task_report/s3-reader.edn"
              cp "$task_root/http-budget.edn" "$task_report/s3-reader-budget.edn"
            )
          done
      - name: Check local baseline again after the S3 sweep
        if: inputs.mode == 'sweep'
        timeout-minutes: 10
        env:
          SDK_STORAGE_ARM: local
        run: |
          set -euo pipefail
          task_root=$(mktemp -d /tmp/typed-batch-local.XXXXXXXX)
          trap '[[ "$task_root" =~ ^/tmp/typed-batch-local\.[A-Za-z0-9]+$ ]] && rm -rf -- "$task_root"' EXIT
          mkdir -p target/typed-batch-research/local-after
          driver="$GITHUB_WORKSPACE/scripts/run_typed_batch_research.sh"
          timeout --kill-after=5s 300s bash "$driver" window "$task_root" 10000 32 true wide16 > "$task_root/writer.log" 2>&1
          CHDB_BENCH_METADATA_READER=stock timeout --kill-after=5s 120s bash "$driver" reader "$task_root" 10000 32 true wide16 > "$task_root/reader.log" 2>&1
          cp "$task_root/writer.edn" target/typed-batch-research/local-after/local-writer.edn
          cp "$task_root/reader.edn" target/typed-batch-research/local-after/local-reader.edn
      - name: Validate exact research receipts, total budget and source parity
        if: inputs.mode == 'sweep'
        run: |
          set -euo pipefail
          test "$(git -C .qualification/benchmark rev-parse HEAD)" = 3fd96c4691c5db49ed4d3ef55622aaa6b9074127
          test "$(git -C .qualification/exporter rev-parse HEAD)" = 67e28b59bfd215da982682dd9c59d51d52d460ed
          test "$(git -C .qualification/json rev-parse HEAD)" = 8d557cc18eb9526ed29ae5613089c3793d5973fa
          for task_repo in .qualification/benchmark .qualification/exporter .qualification/json; do
            git -C "$task_repo" diff --quiet HEAD
          done
          git merge-base --is-ancestor 3d766fa295b0e98c30f275d0a334db92e6dd998c HEAD
          git diff --quiet 3d766fa295b0e98c30f275d0a334db92e6dd998c -- src resources deps.edn
          test "$(sha256sum "$JOLT_CHDB_LIB" | cut -d ' ' -f1)" = a7d22ade86e1de82b187adf572b569a6034600ce932c52b0acb8c97b82430557
          task_receipts="$GITHUB_WORKSPACE/target/typed-batch-research"
          task_check="$GITHUB_WORKSPACE/scripts/verify_typed_batch_research.clj"
          cd /tmp
          "$BENCH_JOLT_WRAPPER" "$BENCH_JOLT_BIN" -Srepro -Sdeps '{:paths [] :deps {}}' "$task_check" "$task_receipts"
      - name: Reject identifiers and credentials from receipt uploads
        id: receipt_scan
        if: always()
        env:
          TASK_ROLE_ARN: ${{ vars.AWS_DURABLE_ROLE_ARN }}
          TASK_BUCKET: ${{ vars.AWS_DURABLE_BUCKET }}
        run: |
          set -euo pipefail
          # Validate the root layout too; never upload an unchecked extra file.
          shopt -s dotglob
          for task_receipt_dir in target/typed-batch-research/*; do
            test -d "$task_receipt_dir" && test ! -L "$task_receipt_dir"
            case "${task_receipt_dir##*/}" in preflight|local|local-after|s3-[1-6]) ;; *) exit 1 ;; esac
            python3 scripts/check_typed_receipt_privacy.py "$task_receipt_dir"
          done
      - name: Upload only bounded scalar receipts
        if: always() && steps.receipt_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: typed-batch-research-receipts
          path: target/typed-batch-research/
          if-no-files-found: warn
          retention-days: 30
