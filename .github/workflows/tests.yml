name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  typed-check:
    name: Typed Clojure pilot (JVM, ABI contracts only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
      - name: Check the real ABI consumer and reject both named mutants
        run: clojure -M:typed-check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.3
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25.0.2'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          bb: 1.13.220
          cli: latest
      - name: Install Jolt v0.8.3
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.3/install \
            | bash -s -- --dir "$install_dir" --version 0.8.3
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        run: test "$(jolt --version)" = "jolt v0.8.3"
      - name: Install pinned chDB
        run: jolt -M:setup-native
      - name: Qualify the selected native ABI on Jolt, Babashka, and JVM
        run: bash scripts/qualify-ffi-runtimes.sh jolt
      - name: Install pinned Hegel native library
        run: jolt -A:test -m hegel.install
      - name: Test Durable owned threads with one Jolt carrier
        run: jolt -M:durable-thread-test
      - name: Test Durable operation-worker close joins
        run: jolt -M:durable-worker-join-test
      - name: Test Durable local POSIX process semantics
        run: bash test/durable-local-posix.sh /usr/bin/env
      - name: Test Durable libcurl SigV4 transport
        run: bash test/durable-s3-curl.sh jolt
      - name: Test
        run: jolt -M:test
