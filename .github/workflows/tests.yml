name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.3
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Jolt v0.8.3
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.3/install \
            | bash -s -- --dir "$install_dir" --version 0.8.3
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        run: test "$(jolt --version)" = "jolt v0.8.3"
      - name: Install pinned chDB
        run: jolt -M:setup-native
      - name: Verify native ABI capability boundary
        run: jolt -M:abi-test
      - name: Install pinned Hegel native library
        run: jolt -A:test -m hegel.install
      - name: Test
        run: jolt -M:test
