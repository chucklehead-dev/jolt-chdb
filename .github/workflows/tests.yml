name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-check:
    name: Typed Clojure pilot (JVM, ABI contracts only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install checksum-pinned Clojure CLI
        env:
          CLOJURE_CLI_VERSION: 1.12.4.1582
          CLOJURE_CLI_URL: https://github.com/clojure/brew-install/releases/download/1.12.4.1582/clojure-tools-1.12.4.1582.tar.gz
          CLOJURE_CLI_SHA256: fd5864f22bf2ec30311f9ce3caf3d31799e04d653b657ecdb4f0836fe972ff21
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/clojure-tools-$CLOJURE_CLI_VERSION.tar.gz"
          unpack_dir="$RUNNER_TEMP/clojure-tools-$CLOJURE_CLI_VERSION"
          install_dir="$RUNNER_TEMP/clojure-cli-$CLOJURE_CLI_VERSION"
          curl -fsSL --retry 2 --retry-all-errors -o "$archive" "$CLOJURE_CLI_URL"
          echo "$CLOJURE_CLI_SHA256  $archive" | sha256sum -c -
          mkdir -p "$unpack_dir" "$install_dir/bin" "$install_dir/libexec" "$install_dir/share/man/man1"
          tar -xzf "$archive" -C "$unpack_dir"
          tool_dir="$unpack_dir/clojure-tools"
          install -m 644 "$tool_dir/deps.edn" "$install_dir/deps.edn"
          install -m 644 "$tool_dir/example-deps.edn" "$install_dir/example-deps.edn"
          install -m 644 "$tool_dir/tools.edn" "$install_dir/tools.edn"
          install -m 644 "$tool_dir/exec.jar" "$install_dir/libexec/exec.jar"
          install -m 644 "$tool_dir/clojure-tools-$CLOJURE_CLI_VERSION.jar" "$install_dir/libexec/clojure-tools-$CLOJURE_CLI_VERSION.jar"
          sed -e "s@PREFIX@$install_dir@g" "$tool_dir/clojure" > "$install_dir/bin/clojure"
          sed -e "s@BINDIR@$install_dir/bin@g" "$tool_dir/clj" > "$install_dir/bin/clj"
          chmod 755 "$install_dir/bin/clojure" "$install_dir/bin/clj"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
      - name: Assert pinned Clojure CLI provenance
        run: test "$(clojure --version)" = "Clojure CLI version 1.12.4.1582"
      - name: Check the real ABI consumer and reject both named mutants
        run: clojure -M:typed-check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.6-aspects-57e591d4
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.6-aspects-57e591d4
      PINNED_JOLT_SOURCE_SHA: 57e591d4d6481c5536858575ffc006cf5a41adbf
      PINNED_JOLT_VERSION: jolt v0.8.6-37-g57e591d4
      JOLT_CHDB_REQUIRE_WAL_BYTE_WRITER: '1'
    steps:
      - uses: actions/checkout@v4
        # The bounded stage-smoke selector records HEAD and its immediate
        # parent as provenance; do not let checkout's default shallow clone
        # silently weaken that evidence.
        with:
          fetch-depth: 2
      - name: Verify SHA-pinned Durable version oracle
        run: scripts/verify-durable-version-oracle.sh
      - name: Verify Durable Python Decimal time fixture
        run: scripts/verify-durable-python-time-fixture.sh
      - name: Install checksum-pinned dynamic Babashka
        env:
          BABASHKA_URL: https://github.com/babashka/babashka/releases/download/v1.13.220/babashka-1.13.220-linux-amd64.tar.gz
          BABASHKA_SHA256: 5211ebf6267be2dbbf4857611cb01331b865bf6b0a8c9bc500c83a816df1a769
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/babashka-1.13.220-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/babashka-dynamic-bin"
          curl -fsSL --retry 2 --retry-all-errors -o "$archive" "$BABASHKA_URL"
          echo "$BABASHKA_SHA256  $archive" | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Download checksum-pinned Corretto 25.0.2
        env:
          CORRETTO_URL: https://corretto.aws/downloads/resources/25.0.2.10.1/amazon-corretto-25.0.2.10.1-linux-x64.tar.gz
          CORRETTO_SHA256: 313e9921e573cf28a4876ab039d56b3a142e7b1b1e847b0dddd170b8dee80387
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/amazon-corretto-25.0.2.10.1-linux-x64.tar.gz"
          curl -fsSL --retry 2 --retry-all-errors -o "$archive" "$CORRETTO_URL"
          echo "$CORRETTO_SHA256  $archive" | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/amazon-corretto-25.0.2.10.1-linux-x64.tar.gz
          java-version: '25.0.2+10.1'
          architecture: x64
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
      - name: Install the pinned Jolt aspect compiler
        id: pinned-jolt
        uses: ./.github/actions/install-jolt-aspects
      - name: Verify pinned Jolt provenance
        run: |
          test "${{ steps.pinned-jolt.outputs.source-sha }}" = "$PINNED_JOLT_SOURCE_SHA"
          test "${{ steps.pinned-jolt.outputs.version }}" = "$PINNED_JOLT_VERSION"
          test "$(jolt --version)" = "$PINNED_JOLT_VERSION"
      - name: Verify pinned Durable conformance inventory
        run: jolt -Srepro -M:durable-conformance-inventory-test
      - name: Qualify the Durable JSON nesting bound on JVM Clojure
        run: clojure -M:durable-head-depth-test
      - name: Install pinned chDB
        run: jolt -M:setup-native
      - name: Smoke a real isolated staged Durable writer child
        timeout-minutes: 4
        env:
          JOLT_WRAPPER: /usr/bin/env
          BENCH_JOLT_SOURCE_SHA: ${{ env.PINNED_JOLT_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export BENCH_JOLT_BIN="$(command -v jolt)"
          export JOLT_CHDB_LIB="$(jolt -Srepro -e '(require (quote [jdbc.chdb.native :as native])) (println (native/library-path))' | tail -n 1)"
          test -f "$JOLT_CHDB_LIB"
          output="$RUNNER_TEMP/durable-stage-smoke"
          bash scripts/run-durable-throughput-selector.sh stage-smoke "$output"
          test -f "$output/report.edn"
          test -f "$output/receipts"/*/writer-result.edn
          test -f "$output/receipts"/*/reader-result.edn
      - name: Qualify ordinary JSONEachRow native insertion
        timeout-minutes: 3
        run: |
          timeout --signal=TERM --kill-after=5s 90s jolt -Srepro -A:abi-test -e \
            "(require 'jdbc.chdb-json-rows-test) (jdbc.chdb-json-rows-test/run-native!)"
      - name: Qualify Samizdat and Durable database-provider convergence
        env:
          JOLT_WRAPPER: /usr/bin/env
        run: test/fixtures/provider-convergence/qualify.sh
      - name: Qualify the selected native ABI on Jolt, Babashka, and JVM
        run: bash scripts/qualify-ffi-runtimes.sh jolt
      - name: Install pinned Hegel native library
        run: jolt -A:test -m hegel.install
      - name: Test Durable owned threads with one Jolt carrier
        run: jolt -M:durable-thread-test
      - name: Test Durable operation-worker close joins
        run: jolt -M:durable-worker-join-test
      - name: Test Durable local POSIX process semantics
        run: bash test/durable-local-posix.sh /usr/bin/env
      - name: Test Durable libcurl SigV4 transport
        run: bash test/durable-s3-curl.sh jolt
      - name: Test
        run: jolt -M:test
