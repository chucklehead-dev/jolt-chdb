name: durable-head-quint

on:
  workflow_dispatch:
    inputs:
      exhaustive:
        description: Run the exhaustive Apalache tier
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/actions/install-jolt-aspects/action.yml
      - .github/workflows/durable-head-quint.yml
      - formal/*.smt2
      - formal/**/*.smt2
      - formal/quint/**
      - scripts/classify-durable-model-paths.sh
      - scripts/validate-durable-benchmark-aliases.py
      - scripts/fingerprint-durable-model-inputs.sh
      - scripts/durable-head-itf-coverage.jq
      - scripts/durable-head-itf-commands.jq
      - scripts/generate-durable-head-itf.sh
      - scripts/generate-durable-engine-metadata-itf.sh
      - scripts/generate-native-process-lifecycle-itf.sh
      - scripts/check-durable-head-itf-corpus.sh
      - scripts/check-durable-head-quint.sh
      - scripts/check-durable-file-wal-spool-quint.sh
      - scripts/check-buffered-publication-quint.sh
      - bench/jdbc/chdb_durable_throughput.clj
      - bench/jdbc/chdb_durable_throughput_metrics.clj
      - scripts/benchmark-durable-matched-provider.sh
      - scripts/run-durable-throughput-selector.sh
      - test/durable-model-path-classifier.sh
      - deps.edn
      - src/jdbc/chdb/durable.clj
      - src/jdbc/chdb/durable/**
      - test/durable-*.sh
      - test/fixtures/durable/**
      - test/jdbc/chdb_durable_*.clj
      - test/jdbc/chdb_durable_throughput_test.clj
      - test/jdbc/chdb_durable_throughput_metrics_test.clj
      - test/support/**
  push:
    branches:
      - main
    paths:
      - .github/actions/install-jolt-aspects/action.yml
      - .github/workflows/durable-head-quint.yml
      - formal/*.smt2
      - formal/**/*.smt2
      - formal/quint/**
      - scripts/classify-durable-model-paths.sh
      - scripts/validate-durable-benchmark-aliases.py
      - scripts/fingerprint-durable-model-inputs.sh
      - scripts/durable-head-itf-coverage.jq
      - scripts/durable-head-itf-commands.jq
      - scripts/generate-durable-head-itf.sh
      - scripts/generate-durable-engine-metadata-itf.sh
      - scripts/generate-native-process-lifecycle-itf.sh
      - scripts/check-durable-head-itf-corpus.sh
      - scripts/check-durable-head-quint.sh
      - scripts/check-durable-file-wal-spool-quint.sh
      - scripts/check-buffered-publication-quint.sh
      - bench/jdbc/chdb_durable_throughput.clj
      - bench/jdbc/chdb_durable_throughput_metrics.clj
      - scripts/benchmark-durable-matched-provider.sh
      - scripts/run-durable-throughput-selector.sh
      - test/durable-model-path-classifier.sh
      - deps.edn
      - src/jdbc/chdb/durable.clj
      - src/jdbc/chdb/durable/**
      - test/durable-*.sh
      - test/fixtures/durable/**
      - test/jdbc/chdb_durable_*.clj
      - test/jdbc/chdb_durable_throughput_test.clj
      - test/jdbc/chdb_durable_throughput_metrics_test.clj
      - test/support/**

permissions:
  contents: read

jobs:
  classify-model-inputs:
    name: Classify Durable model inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exhaustive: ${{ steps.decision.outputs.exhaustive }}
      reason: ${{ steps.decision.outputs.reason }}
      fast: ${{ steps.decision.outputs.fast }}
      fast_reason: ${{ steps.decision.outputs.fast_reason }}
      changed_count: ${{ steps.decision.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
      - name: Install pinned effective-input tangler
        run: go install github.com/driusan/lmt@62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c
      - name: Test effective model-input classification
        # Same pinned extractor for both isolated base/head data exports.
        # No Quint/Jolt/solver is executed by this decision tier.
        run: test/durable-model-path-classifier.sh
      - name: Classify the exact base and head
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_EXHAUSTIVE: ${{ inputs.exhaustive }}
        run: |
          set -euo pipefail
          decision_file=$(mktemp)
          cleanup() { rm -f -- "$decision_file"; }
          trap cleanup EXIT HUP INT TERM
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$MANUAL_EXHAUSTIVE" == true ]]; then
              printf 'exhaustive=true\nreason=manual-full-dispatch\nfast=true\nfast_reason=manual-full-dispatch\nchanged_count=0\n' \
                > "$decision_file"
            else
              printf 'exhaustive=false\nreason=manual-fast-only-dispatch\nfast=true\nfast_reason=manual-fast-only-dispatch\nchanged_count=0\n' \
                > "$decision_file"
            fi
          else
            ensure_object() {
              local label=$1
              local revision=$2
              if [[ ! $revision =~ ^[0-9a-fA-F]{40}$ ]] || \
                 [[ $revision =~ ^0+$ ]]; then
                echo "$label object is missing or zero; classifier will fail closed"
                return 0
              fi
              if ! git fetch --no-tags origin "$revision"; then
                echo "$label fetch did not complete; checking the local object"
              fi
              if git cat-file -e "$revision^{commit}" 2>/dev/null; then
                echo "$label object available: $revision"
              else
                echo "$label object unavailable: $revision"
              fi
            }
            ensure_object base "$BASE_SHA"
            ensure_object head "$HEAD_SHA"
            diff_args=(--diff "$BASE_SHA" "$HEAD_SHA")
            if [[ "$EVENT_NAME" == pull_request ]]; then
              diff_args+=(--merge-base)
            fi
            scripts/classify-durable-model-paths.sh "${diff_args[@]}" \
              > "$decision_file"
          fi
          decision_count=$(grep -c '^exhaustive=' "$decision_file" || true)
          decision_value=$(sed -n 's/^exhaustive=//p' "$decision_file")
          fast_count=$(grep -c '^fast=' "$decision_file" || true)
          fast_value=$(sed -n 's/^fast=//p' "$decision_file")
          reason_count=$(grep -c '^reason=' "$decision_file" || true)
          fast_reason_count=$(grep -c '^fast_reason=' "$decision_file" || true)
          changed_count_count=$(grep -c '^changed_count=' "$decision_file" || true)
          if [[ $decision_count -ne 1 ]] || [[ $fast_count -ne 1 ]] || \
             [[ $reason_count -ne 1 ]] || [[ $fast_reason_count -ne 1 ]] || \
             [[ $changed_count_count -ne 1 ]] || \
             [[ $decision_value != true && $decision_value != false ]] || \
             [[ $fast_value != true && $fast_value != false ]] || \
             [[ $decision_value == true && $fast_value != true ]]; then
            echo "classifier produced an invalid model-tier decision" >&2
            cat "$decision_file" >&2
            exit 1
          fi
          cat "$decision_file"
          cat "$decision_file" >> "$GITHUB_OUTPUT"
          printf 'base=%s\nhead=%s\n' "${BASE_SHA:-none}" "${HEAD_SHA:-none}"

  fast-model-linked:
    name: Durable model fast checks
    needs: classify-model-inputs
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.6-aspects-57e591d4
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.6-aspects-57e591d4
      PINNED_JOLT_SOURCE_SHA: 57e591d4d6481c5536858575ffc006cf5a41adbf
      PINNED_JOLT_VERSION: jolt v0.8.6-37-g57e591d4
    steps:
      - name: Require a successful path decision
        run: |
          test "${{ needs.classify-model-inputs.result }}" = success
          decision="${{ needs.classify-model-inputs.outputs.exhaustive }}"
          fast="${{ needs.classify-model-inputs.outputs.fast }}"
          test "$decision" = true || test "$decision" = false
          test "$fast" = true || test "$fast" = false
          test "$decision" != true || test "$fast" = true
      - name: Report an explicit successful skip
        if: ${{ needs.classify-model-inputs.outputs.fast != 'true' }}
        run: |
          echo "Fast model checks skipped: ${{ needs.classify-model-inputs.outputs.fast_reason }}"
          echo "Changed paths considered: ${{ needs.classify-model-inputs.outputs.changed_count }}"
      - uses: actions/checkout@v4
        if: ${{ needs.classify-model-inputs.outputs.fast == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ needs.classify-model-inputs.outputs.fast == 'true' }}
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        if: ${{ needs.classify-model-inputs.outputs.fast == 'true' }}
        with:
          go-version: '1.26.0'
      - name: Install pinned Quint and literate tangler
        if: ${{ needs.classify-model-inputs.outputs.fast == 'true' }}
        run: |
          npm install --global @informalsystems/quint@0.32.0
          go install github.com/driusan/lmt@62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c
      - name: Install the pinned Jolt aspect compiler
        if: ${{ needs.classify-model-inputs.outputs.fast == 'true' }}
        id: pinned-jolt
        uses: ./.github/actions/install-jolt-aspects
      - name: Verify pinned Jolt provenance
        if: ${{ needs.classify-model-inputs.outputs.fast == 'true' }}
        run: |
          test "${{ steps.pinned-jolt.outputs.source-sha }}" = "$PINNED_JOLT_SOURCE_SHA"
          test "${{ steps.pinned-jolt.outputs.version }}" = "$PINNED_JOLT_VERSION"
          test "$(jolt --version)" = "$PINNED_JOLT_VERSION"
      - name: Assert tool versions
        if: ${{ needs.classify-model-inputs.outputs.fast == 'true' }}
        run: |
          test "$(quint --version)" = "0.32.0"
          test "$(jolt --version)" = "$PINNED_JOLT_VERSION"
          test "$(go version -m "$(command -v lmt)" | awk '$1 == "mod" { print $3 }')" = "v0.0.0-20210421124901-62fe18f2f6a6"
      - name: Replay one deterministic Quint ITF corpus through memory and S3
        if: ${{ needs.classify-model-inputs.outputs.fast == 'true' }}
        run: scripts/check-durable-head-itf-corpus.sh --with-s3
      - name: Tangle, typecheck, test, sample, and replay generated ITF
        if: ${{ needs.classify-model-inputs.outputs.fast == 'true' }}
        run: scripts/check-durable-head-quint.sh

  literate-model:
    # Preserve the historical required-check name. This job always reports a
    # result and still represents the complete old contract by requiring the
    # new fast tier first. Unchanged exhaustive inputs then take the explicit
    # successful path.
    name: literate-model
    needs:
      - classify-model-inputs
      - fast-model-linked
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require a successful path decision
        run: |
          test "${{ needs.classify-model-inputs.result }}" = success
          test "${{ needs.fast-model-linked.result }}" = success
          decision="${{ needs.classify-model-inputs.outputs.exhaustive }}"
          fast="${{ needs.classify-model-inputs.outputs.fast }}"
          test "$decision" = true || test "$decision" = false
          test "$fast" = true || test "$fast" = false
          test "$decision" != true || test "$fast" = true
      - name: Report an explicit successful skip
        if: ${{ needs.classify-model-inputs.outputs.exhaustive != 'true' }}
        run: |
          echo "Apalache skipped: ${{ needs.classify-model-inputs.outputs.reason }}"
          echo "Changed paths considered: ${{ needs.classify-model-inputs.outputs.changed_count }}"
      - uses: actions/checkout@v4
        if: ${{ needs.classify-model-inputs.outputs.exhaustive == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ needs.classify-model-inputs.outputs.exhaustive == 'true' }}
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        if: ${{ needs.classify-model-inputs.outputs.exhaustive == 'true' }}
        with:
          go-version: '1.26.0'
      - name: Install pinned Quint and literate tangler
        if: ${{ needs.classify-model-inputs.outputs.exhaustive == 'true' }}
        run: |
          npm install --global @informalsystems/quint@0.32.0
          go install github.com/driusan/lmt@62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c
      - name: Assert exhaustive tool versions
        if: ${{ needs.classify-model-inputs.outputs.exhaustive == 'true' }}
        run: |
          test "$(quint --version)" = "0.32.0"
          test "$(go version -m "$(command -v lmt)" | awk '$1 == "mod" { print $3 }')" = "v0.0.0-20210421124901-62fe18f2f6a6"
      - name: Tangle, typecheck, and run exhaustive Apalache checks
        if: ${{ needs.classify-model-inputs.outputs.exhaustive == 'true' }}
        run: scripts/check-durable-head-quint.sh --verify-only
