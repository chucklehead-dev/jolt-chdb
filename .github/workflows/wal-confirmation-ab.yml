name: bounded WAL checksum confirmation comparison

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: measured-exporter-storage
  cancel-in-progress: false

jobs:
  wal-head-comparison:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment: aws-durable-ci
    env:
      JOLT_AOT_CACHE: '0'
      JOLT_NO_USER_DEPS: '1'
      QUALIFIED_RUNTIME_PROFILE: current-0821-1ae7
      QUALIFIED_RUNTIME_RUN_ID: '38618434034'
      QUALIFIED_RUNTIME_RUN_ATTEMPT: '1'
      QUALIFIED_RUNTIME_WORKFLOW_SHA: 1533b9fe6f7782f4d024a07aefbfb7ce50c4251b
      QUALIFIED_RUNTIME_ARTIFACT_ID: '11921513712'
      QUALIFIED_RUNTIME_ARTIFACT_SHA256: 931dda8bf4e9d9beeaa92ad64b8a1c925d3ab670f87414ec9efee9af28cb3537
      QUALIFIED_RUNTIME_BINARY_SHA256: 06a2ccb858c072bfcd74ce94d96eb95f008d75e0fb1f46117728602572189811
      SDK_STREAM_ARM: stream
      SDK_EXPORT_CALLERS: '1'
      CHDB_BENCH_OWNED_OUTPUT: 'true'
      CHDB_BENCH_SAMPLE_COUNTERS: 'true'
      CHDB_BENCH_METADATA_READER: native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare fixed scalar receipt directory
        run: mkdir -p target/wal-confirmation-ab
      - uses: actions/checkout@v4
        with:
          ref: 7efb62f96c8f636cfa50714067ce368c53794d4d
          path: .qualification/baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7efb62f96c8f636cfa50714067ce368c53794d4d
          path: .qualification/candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: chucklehead-dev/jolt-otel-clickhouse
          ref: 4f3bfd2bac88227710a3687b2a14fb5274689ef8
          path: .qualification/exporter
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casselc/data.json
          ref: b959a5625c28cc8571e04de5ca02a2c8902b8b5e
          path: .qualification/json
          persist-credentials: false
      - name: Authenticate exact green compiler artifact
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/fetch-qualified-durable-runtime.sh"
          curl -fsSL --connect-timeout 15 --max-time 30 \
            https://raw.githubusercontent.com/chucklehead-dev/jolt-otel-clickhouse/96119103195b67cfc9fd52277251888980fc7852/scripts/fetch-qualified-durable-runtime.sh \
            -o "$helper"
          printf '%s  %s\n' 81030fafdb2e3c79765792d043585139f4410c27a281113dd19874b4c27e74b2 "$helper" | sha256sum -c -
          TMPDIR=/tmp timeout --signal=TERM --kill-after=5s 240s bash "$helper" | tee "$RUNNER_TEMP/qualified-runtime.log"
          test "$(grep -c '^QUALIFIED_RUNTIME_BIN=' "$RUNNER_TEMP/qualified-runtime.log")" = 1
          task_bin=$(sed -n 's/^QUALIFIED_RUNTIME_BIN=//p' "$RUNNER_TEMP/qualified-runtime.log")
          [[ "$task_bin" =~ ^/tmp/qualified-durable-runtime\.[A-Za-z0-9]+/jolt$ ]]
          test -f "$task_bin" && test ! -L "$task_bin"
          test "$(realpath "$task_bin")" = "$task_bin"
          echo "BENCH_JOLT_BIN=$task_bin" >> "$GITHUB_ENV"
          echo "BENCH_RUNTIME_BINARY_SHA256=$QUALIFIED_RUNTIME_BINARY_SHA256" >> "$GITHUB_ENV"
          echo "BENCH_EXPECT_EXPORTER_ROOT=$GITHUB_WORKSPACE/.qualification/exporter" >> "$GITHUB_ENV"
          echo "BENCH_EXPECT_JSON_ROOT=$GITHUB_WORKSPACE/.qualification/json" >> "$GITHUB_ENV"
          echo "TASK_TYPED_BUDGET_DRIVER=$GITHUB_WORKSPACE/scripts/typed_storage_confirmation_driver.clj" >> "$GITHUB_ENV"
          echo "BENCH_JOLT_WRAPPER=$GITHUB_WORKSPACE/scripts/current_typed_jolt.sh" >> "$GITHUB_ENV"
      - name: Install exact native26.9.0 without changing application defaults
        run: |
          set -euo pipefail
          task_native_dir=$(mktemp -d "$RUNNER_TEMP/current-typed-native.XXXXXXXX")
          task_archive="$task_native_dir/native.tar.gz"
          curl -fsSL --connect-timeout 15 --max-time 300 \
            https://github.com/chdb-io/chdb-core/releases/download/v26.9.0/linux-x86_64-libchdb.tar.gz -o "$task_archive"
          printf '%s  %s\n' c6398bcc71dc58d12fb81548540aacd5d8248830ec81cec537f51c114670543b "$task_archive" | sha256sum -c -
          task_member=$(tar -tzf "$task_archive" | grep -E '(^|/)libchdb\.so$')
          test "$(printf '%s\n' "$task_member" | wc -l)" = 1
          tar --extract --gzip --to-stdout --file "$task_archive" -- "$task_member" > "$task_native_dir/libchdb.so"
          printf '%s  %s\n' a7d22ade86e1de82b187adf572b569a6034600ce932c52b0acb8c97b82430557 "$task_native_dir/libchdb.so" | sha256sum -c -
          rm -- "$task_archive"
          echo "JOLT_CHDB_LIB=$task_native_dir/libchdb.so" >> "$GITHUB_ENV"
      - name: Prove both arm identities through dummy-credential loopback first
        timeout-minutes: 5
        run: bash scripts/test_wal_head_identity.sh "$BENCH_JOLT_BIN" "$GITHUB_WORKSPACE/.qualification/baseline" "$GITHUB_WORKSPACE/.qualification/json"
      - name: Qualify full confirmation selection chain through fake-credential TLS
        timeout-minutes: 5
        run: bash scripts/test_confirmation_profile_tls.sh "$BENCH_JOLT_BIN" "$GITHUB_WORKSPACE/.qualification/baseline"
      - name: Require failure diagnostics through the actual immutable SDK entry point
        timeout-minutes: 3
        env:
          QUALIFIED_STORAGE_SOURCE_PROFILE: wal-checksum-confirmation
        run: bash scripts/test_confirmation_entrypoint_failure.sh "$GITHUB_WORKSPACE/.qualification/baseline"
      - name: Assume existing protected CI role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DURABLE_ROLE_ARN }}
          role-session-name: chdb-wal-head-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_DURABLE_REGION }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Require deployed scope and bounded retention before object writes
        timeout-minutes: 5
        env:
          TASK_ROLE_ARN: ${{ vars.AWS_DURABLE_ROLE_ARN }}
          TASK_BUCKET: ${{ vars.AWS_DURABLE_BUCKET }}
          TASK_PREFIX: ci/jolt-chdb/${{ github.run_id }}-${{ github.run_attempt }}/typed-window
          AWS_PAGER: ''
        run: |
          set -euo pipefail
          python3 scripts/typed_s3_preflight.py | tee target/wal-confirmation-ab/preflight.json
      - name: Compare both fixed local and adjacent S3 windows with stock recovery
        timeout-minutes: 55
        env:
          JOLT_CHDB_S3_BUCKET: ${{ vars.AWS_DURABLE_BUCKET }}
          JOLT_CHDB_S3_PREFIX: ci/jolt-chdb/${{ github.run_id }}-${{ github.run_attempt }}/typed-window
        run: |
          set -euo pipefail
          # No environment/header/body dump or shell tracing. Aliases are exact
          # copies; later scanning persisted AWS_* values covers these too.
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$AWS_SESSION_TOKEN"
          export JOLT_CHDB_S3_ENDPOINT="https://s3.${AWS_REGION}.amazonaws.com"
          export JOLT_CHDB_S3_REGION="$AWS_REGION"
          export JOLT_CHDB_S3_ACCESS_KEY="$AWS_ACCESS_KEY_ID"
          export JOLT_CHDB_S3_SECRET_KEY="$AWS_SECRET_ACCESS_KEY"
          export JOLT_CHDB_S3_SESSION_TOKEN="$AWS_SESSION_TOKEN"
          # Each arm:256measured10k +3warmups,24k writer requests/6GiB cap,
          # 1000reader GETs/zero upload. Aggregate writer cap48k/12GiB, not6GiB.
          # Global50min deadline fits the role after the5min preflight bound.
          timeout --kill-after=5s 3000s bash scripts/run_wal_confirmation_ab.sh \
            "$GITHUB_WORKSPACE/.qualification/baseline" \
            "$GITHUB_WORKSPACE/.qualification/candidate" \
            "$GITHUB_WORKSPACE/target/wal-confirmation-ab"
      - name: Validate every fixed source and both workload/recovery profiles
        run: |
          set -euo pipefail
          test "$(git -C .qualification/baseline rev-parse HEAD)" = 7efb62f96c8f636cfa50714067ce368c53794d4d
          test "$(git -C .qualification/candidate rev-parse HEAD)" = 7efb62f96c8f636cfa50714067ce368c53794d4d
          test "$(git -C .qualification/exporter rev-parse HEAD)" = 4f3bfd2bac88227710a3687b2a14fb5274689ef8
          test "$(git -C .qualification/json rev-parse HEAD)" = b959a5625c28cc8571e04de5ca02a2c8902b8b5e
          for task_repo in .qualification/baseline .qualification/candidate .qualification/exporter .qualification/json; do
            git -C "$task_repo" diff --quiet HEAD
            task_untracked=$(git -C "$task_repo" ls-files --others -- src resources deps.edn bench test)
            test -z "$task_untracked"
          done
          test "$(sha256sum "$JOLT_CHDB_LIB" | cut -d ' ' -f1)" = a7d22ade86e1de82b187adf572b569a6034600ce932c52b0acb8c97b82430557
          task_receipts="$GITHUB_WORKSPACE/target/wal-confirmation-ab"
          task_check="$GITHUB_WORKSPACE/scripts/verify_wal_confirmation_ab.clj"
          cd /tmp
          "$BENCH_JOLT_WRAPPER" "$BENCH_JOLT_BIN" -Srepro -Sdeps '{:paths [] :deps {}}' "$task_check" "$task_receipts"
      - name: Reject identifiers and credentials from scalar receipt uploads
        id: receipt_scan
        if: always()
        env:
          TASK_ROLE_ARN: ${{ vars.AWS_DURABLE_ROLE_ARN }}
          TASK_BUCKET: ${{ vars.AWS_DURABLE_BUCKET }}
        run: |
          set -euo pipefail
          for task_arm in baseline candidate; do
            task_dir="target/wal-confirmation-ab/$task_arm"
            if [[ -d "$task_dir" ]]; then
              python3 scripts/check_typed_receipt_privacy.py "$task_dir"
            fi
          done
      - name: Upload only both fixed scalar receipt directories
        if: always() && steps.receipt_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wal-confirmation-ab-receipts
          path: |
            target/wal-confirmation-ab/baseline/
            target/wal-confirmation-ab/candidate/
          if-no-files-found: warn
          retention-days: 30
