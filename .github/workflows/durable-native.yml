name: durable-native-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/actions/install-jolt-aspects/action.yml
      - .github/workflows/durable-native.yml
      - deps.edn
      - resources/jdbc/chdb/abi.edn
      - scripts/qualify-durable-native.sh
      - src/jdbc/chdb/abi.clj
      - src/jdbc/chdb/native.clj
      - test/jdbc/chdb_abi_test.clj
      - test/jdbc/chdb_durable_native_test.clj

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.6-aspects-120643d6
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.6-aspects-120643d6
      PINNED_JOLT_SOURCE_SHA: 120643d6bc322800a700e870de5c8087ad6085fa
      PINNED_JOLT_VERSION: jolt v0.8.6-97-g120643d6
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Jolt aspect compiler
        id: pinned-jolt
        uses: ./.github/actions/install-jolt-aspects
      - name: Verify pinned Jolt provenance
        run: |
          test "${{ steps.pinned-jolt.outputs.source-sha }}" = "$PINNED_JOLT_SOURCE_SHA"
          test "${{ steps.pinned-jolt.outputs.version }}" = "$PINNED_JOLT_VERSION"
          test "$(jolt --version)" = "$PINNED_JOLT_VERSION"
      - name: Run pinned upstream and Jolt Durable ABI oracles
        run: bash scripts/qualify-durable-native.sh "$RUNNER_TEMP/chdb-durable"
