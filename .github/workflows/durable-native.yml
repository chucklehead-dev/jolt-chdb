name: durable-native-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/durable-native.yml
      - deps.edn
      - resources/jdbc/chdb/abi.edn
      - scripts/qualify-durable-native.sh
      - src/jdbc/chdb/abi.clj
      - src/jdbc/chdb/native.clj
      - test/jdbc/chdb_abi_test.clj
      - test/jdbc/chdb_durable_native_test.clj

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.3
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Jolt v0.8.3
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.3/install \
            | bash -s -- --dir "$install_dir" --version 0.8.3
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        run: test "$(jolt --version)" = "jolt v0.8.3"
      - name: Run pinned upstream and Jolt Durable ABI oracles
        run: bash scripts/qualify-durable-native.sh "$RUNNER_TEMP/chdb-durable"
