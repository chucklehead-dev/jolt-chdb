name: Install pinned Jolt aspect compiler
description: Build and cache the exact aspect-capable Jolt compiler required by jolt-chdb

outputs:
  source-sha:
    description: Exact casselc/jolt source revision selected by this action
    value: ${{ steps.select-jolt.outputs.source-sha }}
  version:
    description: Exact version banner selected by this action
    value: ${{ steps.select-jolt.outputs.version }}

runs:
  using: composite
  steps:
    - name: Cache the pinned Jolt compiler
      id: cache-jolt
      # Immutable commit pin preserves the actions/cache v4 behavior.
      # actions/cache@v4.3.0 -> 0057852bfaa89a56745cba8c7296529d2fc39830
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.tool_cache }}/jolt-aspects/bf8a5dde7bebb5658d218e9757ab1df0aa9c3b95
        key: jolt-aspects-${{ runner.os }}-${{ runner.arch }}-bf8a5dde7bebb5658d218e9757ab1df0aa9c3b95

    - name: Install compiler build dependencies
      if: steps.cache-jolt.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential git liblz4-dev zlib1g-dev libncurses-dev uuid-dev

    - name: Install compiler build dependencies on macOS
      if: steps.cache-jolt.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        # The Jolt launcher discovers this Homebrew prefix when linking on
        # Darwin.
        brew install lz4

    - name: Cache Chez Scheme 10.4.1
      if: steps.cache-jolt.outputs.cache-hit != 'true'
      id: cache-chez
      # Immutable commit pin preserves the actions/cache v4 behavior.
      # actions/cache@v4.3.0 -> 0057852bfaa89a56745cba8c7296529d2fc39830
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.tool_cache }}/chez/10.4.1
        key: chez-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-v10.4.1-x11off-pic

    - name: Build Chez Scheme 10.4.1
      if: steps.cache-jolt.outputs.cache-hit != 'true' && steps.cache-chez.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth 1 --branch v10.4.1 https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
        cd "$RUNNER_TEMP/chez-src"
        chez_prefix="$RUNNER_TOOL_CACHE/chez/10.4.1"
        jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)
        ./configure --installprefix="$chez_prefix" --threads --disable-x11 CFLAGS+=-fPIC
        make -j"$jobs"
        make install

    - name: Build the exact Jolt compiler
      if: steps.cache-jolt.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        chez_prefix="$RUNNER_TOOL_CACHE/chez/10.4.1"
        printf '#!/bin/sh\nexec "$(dirname "$0")/scheme" "$@"\n' > "$chez_prefix/bin/chez"
        chmod +x "$chez_prefix/bin/chez"
        test "$("$chez_prefix/bin/chez" --version)" = "10.4.1"

        source_dir="$RUNNER_TEMP/jolt-aspects-source"
        git init "$source_dir"
        git -C "$source_dir" remote add origin https://github.com/casselc/jolt.git
        git -C "$source_dir" fetch --depth 1 origin bf8a5dde7bebb5658d218e9757ab1df0aa9c3b95
        git -C "$source_dir" checkout --detach FETCH_HEAD
        test "$(git -C "$source_dir" rev-parse HEAD)" = "bf8a5dde7bebb5658d218e9757ab1df0aa9c3b95"
        git -C "$source_dir" submodule update --init --recursive --depth 1

        PATH="$chez_prefix/bin:$PATH" \
          JOLT_VERSION="v0.8.6-599-gbf8a5dde" \
          make -C "$source_dir" -j1 jolt-release

        install_dir="$RUNNER_TOOL_CACHE/jolt-aspects/bf8a5dde7bebb5658d218e9757ab1df0aa9c3b95"
        mkdir -p "$install_dir"
        cp "$source_dir/target/release/jolt" "$install_dir/jolt"
        chmod +x "$install_dir/jolt"

    - name: Select and verify the pinned Jolt compiler
      id: select-jolt
      shell: bash
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TOOL_CACHE/jolt-aspects/bf8a5dde7bebb5658d218e9757ab1df0aa9c3b95"
        actual_version="$("$install_dir/jolt" --version)"
        echo "Built $actual_version from casselc/jolt@bf8a5dde7bebb5658d218e9757ab1df0aa9c3b95"
        test "$actual_version" = "jolt v0.8.6-599-gbf8a5dde"
        echo "source-sha=bf8a5dde7bebb5658d218e9757ab1df0aa9c3b95" >> "$GITHUB_OUTPUT"
        echo "version=$actual_version" >> "$GITHUB_OUTPUT"
        echo "$install_dir" >> "$GITHUB_PATH"
