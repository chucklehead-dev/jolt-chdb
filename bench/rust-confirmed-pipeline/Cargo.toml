[package]
name = "jolt-chdb-rust-confirmed-pipeline"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
chdb-rust = { git = "https://github.com/chdb-io/chdb-rust.git", rev = "e685da930ecf02198c0b9e72a412cbc25842deb1", default-features = false, features = ["durable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[profile.release]
debug = 0
incremental = false

